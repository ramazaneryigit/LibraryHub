services:

  postgres:
    image: postgres:16
    container_name: libraryhub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  # One-shot schema migration. It uses the schema owner credential because only
  # that role has DDL rights, and it has to finish before the API starts: one of
  # the migrations creates the non-superuser role the API connects as.
  migrate:
    build:
      context: ./backend

    container_name: libraryhub-migrate
    restart: "no"

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}

    volumes:
      - ./backend:/app

    command: ["alembic", "upgrade", "head"]

    depends_on:
      postgres:
        condition: service_healthy


  api:
    build:
      context: ./backend

    container_name: libraryhub-api
    restart: unless-stopped

    environment:
      # Owner credential. Kept only so a one-off `docker compose exec api
      # alembic ...` works; the application itself reads APP_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Runtime credential: a non-superuser role, so row level security on the
      # tenant schema actually applies.
      APP_DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}

    ports:
      - "8010:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The outbox consumer, on its own rather than in a thread inside the API.
  #
  # The API runs with several workers, and a thread in each would drain the same
  # events concurrently. Consume is written so duplicates are survivable, but
  # "survivable" is not the standard for the thing the search index is built from:
  # one process drains it.
  #
  # Owner credential, because it writes documents in the global plane and has to
  # read across every tenant to build them.
  worker:
    build:
      context: ./backend

    container_name: libraryhub-worker
    restart: unless-stopped

    command: ["python", "scripts/worker.py"]

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # How long to wait when there is nothing to do, and how many events one pass
      # takes. A backlog drains in batches rather than in one transaction that
      # grows until it fails.
      LIBRARYHUB_WORKER_INTERVAL: "5"
      LIBRARYHUB_WORKER_BATCH: "1000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully


volumes:
  postgres_data:
