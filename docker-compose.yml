services:

  postgres:
    image: postgres:16
    container_name: libraryhub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./backend

    container_name: libraryhub-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://library:library_dev_password@postgres:5432/libraryhub

    ports:
      - "8010:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: