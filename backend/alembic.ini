[alembic]
script_location = %(here)s/alembic

# The connection string comes from the DATABASE_URL environment variable, which
# docker compose sets for the migrate service. Nothing is committed here: a
# password in the repository is a credential leak, and a fallback that can win
# silently is how migrations run against the wrong database. `env.py` raises if
# DATABASE_URL is missing rather than guessing.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
